[package]
name = "midetor"
version = "1.3.2"
edition = "2024"
license-file="LICENSE"
keywords = ["editor", "markdown"]
categories = ["text-editors"]
description = "midetor is a terminal-based vim like Markdown editor."
repository = "https://github.com/andrenaP/midetor"
readme = "README.md"
exclude = ["images/*",]
parallel_compiler=true

[dependencies]
crossterm = "0.27.0"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
tui-textarea = "0.7.0"
ratatui = "0.29.0" # Updated to match tui-textarea 0.7.0 dependency
chrono = "0.4"
syntect = "5.3.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
ratatui-image = "8.0.2"
image = {version= "0.25.8", features = ["avif","avif-native"]} # Compatible with ratatui-image 8.0.2
regex = "1.10"
walkdir = "2.5"
serde_json = "1.0.149"
unicode-width = "0.1"
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize"] }
markdown-scanner = "1.3.1"
# markdown-scanner = { path = "../markdown-scanner" }
tokio = { version = "1.0", features = ["full"] }
arboard = { version = "3.4", features = ["wayland-data-control"] }
url = "2.5"
env_logger = "0.10"



[profile.release]
panic = "abort"
opt-level = "z"
codegen-units = 1
lto = "fat"
debug = false
strip = "symbols"

# Custom profile for the i686 musl build
[profile.i686-release]
inherits = "release"
opt-level = "s"
overflow-checks = false

# Drop overflow checks for dependencies in the custom profile
[profile.i686-release.package."*"]
overflow-checks = false
